<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emoji Mirror 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  @property --c1 { syntax: "<color>"; inherits: true; initial-value: #ffd45e; }
  @property --c2 { syntax: "<color>"; inherits: true; initial-value: #c27a00; }

  :root { --glass: rgba(20, 17, 30, .62); --ink: #fff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: radial-gradient(ellipse at 50% 40%, var(--c1), var(--c2) 80%);
    transition: --c1 1s ease, --c2 1s ease;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .pill {
    background: var(--glass); color: var(--ink);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-radius: 999px; border: 0; font: inherit;
  }
  header { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; z-index: 5; pointer-events: none; }
  header > * { pointer-events: auto; }
  .brand { padding: 9px 18px; font-weight: 800; letter-spacing: -0.01em; }
  #dexBtn { padding: 9px 18px; font-weight: 600; cursor: pointer; }
  #dexBtn:hover { background: rgba(20, 17, 30, .8); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  #cam {
    position: fixed; left: 16px; top: 68px; width: min(30vw, 190px); aspect-ratio: 4 / 3;
    border-radius: 22px; overflow: hidden; background: #000; z-index: 4;
    box-shadow: 0 0 0 4px rgba(255,255,255,.85), 0 8px 24px rgba(0,0,0,.25);
  }
  #cam[hidden] { display: none; }
  #cam video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  #handCv { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
  #handBadge { position: absolute; left: 8px; bottom: 8px; padding: 4px 10px; font-size: .75rem; font-weight: 600; max-width: 62%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stopBtn { position: absolute; right: 8px; bottom: 8px; padding: 5px 12px; font-size: .78rem; font-weight: 600; cursor: pointer; }

  #caption {
    position: fixed; left: 0; right: 0; bottom: 28px; z-index: 4;
    display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 0 16px; text-align: center;
  }
  #name { padding: 10px 26px; font-size: clamp(1.4rem, 4.4vw, 2.5rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; max-width: 92vw; }
  #sub { padding: 7px 16px; font-size: .95rem; max-width: 92vw; }
  #sub:empty { display: none; }
  #startBtn {
    font: inherit; font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em;
    background: #fff; color: #1c1b22; border: 0; border-radius: 999px; padding: 15px 34px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  #startBtn:hover { transform: scale(1.03); }
  #startBtn:disabled { opacity: .6; cursor: progress; transform: none; }

  #toast {
    position: fixed; top: 68px; left: 50%; transform: translate(-50%, -20px); opacity: 0;
    padding: 10px 20px; font-weight: 600; z-index: 8; pointer-events: none;
    transition: opacity .25s, transform .25s; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* collection sheet */
  #dex {
    position: fixed; inset: 0; z-index: 10; background: rgba(12, 10, 20, .94); color: #fff;
    overflow-y: auto; padding: 72px 20px 40px;
  }
  #dex[hidden] { display: none; }
  .dexTop { position: fixed; top: 16px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .dexTop h2 { font-size: 1.1rem; font-weight: 800; }
  .dexTop button { font: inherit; font-weight: 600; background: #fff; color: #1c1b22; border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer; }
  .dexTop .ghost { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.5); }
  .group { max-width: 980px; margin: 0 auto 28px; }
  .group h3 { font-size: 1rem; font-weight: 800; margin-bottom: 4px; }
  .group p { color: #a9a6bb; font-size: .85rem; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px; }
  .tile {
    position: relative; aspect-ratio: 1; border: 0; border-radius: 18px; background: rgba(255,255,255,.07);
    cursor: pointer; padding: 8px; display: grid; place-items: center; font: inherit; color: #fff;
  }
  .tile:hover { background: rgba(255,255,255,.16); }
  .tile img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tile .glyph { font-size: 2.2rem; }
  .tile.locked img, .tile.locked .glyph { filter: grayscale(1) brightness(.3); }
  .tile .tag { position: absolute; right: 6px; bottom: 5px; font-size: .62rem; font-weight: 600; background: rgba(255,255,255,.18); border-radius: 99px; padding: 1px 6px; }

  #debug {
    position: fixed; right: 12px; bottom: 12px; z-index: 9; background: rgba(0,0,0,.72); color: #9fffb4;
    font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; padding: 10px 12px; border-radius: 12px; white-space: pre; pointer-events: none;
  }
  #debug[hidden] { display: none; }


  /* ---------- challenge game ---------- */
  .hdrR { display: flex; gap: 10px; align-items: center; }
  #playBtn { padding: 9px 20px; font-weight: 800; cursor: pointer; background: #fff; color: #1c1b22; }
  #playBtn:hover { background: #f1f0f6; }
  #playBtn[hidden] { display: none; }
  .glass { background: var(--glass); color: #fff; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-radius: 22px; }
  #game { position: fixed; right: 16px; top: 68px; width: min(340px, calc(100vw - 32px)); z-index: 6; padding: 14px 16px 12px; display: grid; gap: 10px; transition: box-shadow .2s; }
  #game[hidden] { display: none; }
  .gtop { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: .9rem; opacity: .92; }
  #gScore { font-weight: 800; font-size: 1.05rem; }
  .gmain { display: flex; gap: 12px; align-items: center; }
  #gImg { width: 76px; height: 76px; object-fit: contain; flex: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
  #gName { font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; line-height: 1.15; }
  #gHint { font-size: .85rem; opacity: .88; margin-top: 4px; min-height: 1.2em; }
  .gbar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.2); overflow: hidden; }
  #gFill { display: block; height: 100%; width: 100%; background: #7cffb2; border-radius: 99px; }
  #gFill.low { background: #ff6b6b; }
  .gfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .85rem; }
  .gfoot button { font: inherit; font-weight: 600; font-size: .78rem; color: #fff; background: rgba(255,255,255,.16); border: 0; border-radius: 99px; padding: 5px 12px; cursor: pointer; }
  .gfoot button:hover { background: rgba(255,255,255,.28); }
  #game.win { box-shadow: 0 0 0 4px #7cffb2; }
  #game.miss { box-shadow: 0 0 0 4px #ff6b6b; animation: shake .4s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  body.gameOn #toast { top: auto; bottom: 150px; }
  #count { position: fixed; inset: 0; display: grid; place-items: center; z-index: 7; pointer-events: none;
    font-size: clamp(6rem, 22vw, 16rem); font-weight: 800; letter-spacing: -0.04em; color: #fff; text-shadow: 0 8px 40px rgba(0,0,0,.45); }
  #count[hidden] { display: none; }
  #count.pop { animation: cpop .5s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes cpop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #results { position: fixed; inset: 0; z-index: 11; background: rgba(12, 10, 20, .94); color: #fff; overflow-y: auto; padding: 56px 20px 40px; }
  #results[hidden] { display: none; }
  .rbox { max-width: 560px; margin: 0 auto; text-align: center; }
  .rbox h2 { font-size: 1.1rem; font-weight: 800; color: #b9b6cc; }
  .rbig { font-size: clamp(4rem, 16vw, 6.5rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin: 8px 0 4px; }
  .rline { color: #cfcde0; margin-top: 6px; }
  .rbadge { display: inline-block; margin-top: 10px; background: #ffd45e; color: #1c1b22; font-weight: 800; border-radius: 99px; padding: 5px 14px; }
  .rlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; margin: 26px 0; }
  .ritem { position: relative; background: rgba(255,255,255,.07); border-radius: 16px; padding: 8px 6px 6px; font-size: .75rem; }
  .ritem img { width: 56px; height: 56px; object-fit: contain; display: block; margin: 0 auto 4px; }
  .ritem.bad img { filter: grayscale(1) brightness(.5); }
  .ritem .mark { position: absolute; top: 4px; right: 6px; font-weight: 800; }
  .ritem.ok .mark { color: #7cffb2; } .ritem.bad .mark { color: #ff6b6b; }
  .rbtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .rbtns button { font: inherit; font-weight: 800; background: #fff; color: #1c1b22; border: 0; border-radius: 99px; padding: 13px 28px; cursor: pointer; }
  .rbtns button.ghost { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.5); }


  /* ---------- smart + share ---------- */
  .hb { padding: 9px 14px; font-weight: 600; cursor: pointer; }
  .hb:hover, #dexBtn:hover { background: rgba(20, 17, 30, .8); }
  .dexTop { top: 0 !important; left: 0 !important; right: 0 !important; padding: 12px 20px; background: rgba(12,10,20,.97); flex-wrap: wrap; z-index: 2; }
  #dex { padding-top: 110px; }
  .tile.mine::after { content: "mine"; position: absolute; left: 6px; bottom: 5px; font-size: .62rem; font-weight: 800; background: #ffd45e; color: #1c1b22; border-radius: 99px; padding: 1px 6px; }
  #tune { position: fixed; left: 50%; top: 76px; transform: translateX(-50%); width: min(420px, 92vw); z-index: 7; padding: 16px 18px; text-align: center; display: grid; gap: 8px; justify-items: center; }
  #tune[hidden] { display: none; }
  #tStep { font-size: .8rem; opacity: .75; font-weight: 600; }
  #tTitle { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; }
  #tSub { font-size: .9rem; opacity: .85; min-height: 1.2em; }
  #tImg { width: 84px; height: 84px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
  #tune .gbar { width: 100%; }
  #tFill { display: block; height: 100%; width: 0%; background: #ffd45e; border-radius: 99px; }
  #tFill.cap { background: #7cffb2; }
  #tCancel { font: inherit; font-weight: 600; font-size: .78rem; color: #fff; background: rgba(255,255,255,.16); border: 0; border-radius: 99px; padding: 5px 14px; cursor: pointer; }
  #shareModal, #tileMenu { position: fixed; inset: 0; z-index: 14; background: rgba(12,10,20,.9); display: grid; place-items: center; padding: 20px; overflow: auto; }
  #shareModal[hidden], #tileMenu[hidden] { display: none; }
  .smBox, .tmBox { text-align: center; color: #fff; max-width: min(92vw, 520px); }
  .smBox img { max-width: 100%; max-height: 66vh; border-radius: 18px; display: block; margin: 0 auto 16px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .smBtns, .tmBtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .tmBtns { flex-direction: column; align-items: center; }
  .smBtns button, .tmBtns button { font: inherit; font-weight: 800; background: #fff; color: #1c1b22; border: 0; border-radius: 99px; padding: 12px 26px; cursor: pointer; }
  .smBtns button.ghost, .tmBtns button.ghost { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.5); }
  #shNote { margin-top: 12px; font-size: .8rem; color: #b9b6cc; }
  .tmBox img { width: 170px; height: 170px; object-fit: contain; filter: drop-shadow(0 8px 14px rgba(0,0,0,.5)); }
  #tmName { font-size: 1.5rem; font-weight: 800; margin: 8px 0 4px; }
  #tmHint { color: #b9b6cc; min-height: 1.3em; margin-bottom: 16px; }
  #practice { position: fixed; right: 16px; top: 68px; width: min(340px, calc(100vw - 32px)); z-index: 6; padding: 14px 16px 12px; display: grid; gap: 10px; }
  #practice[hidden] { display: none; }
  #pImg { width: 76px; height: 76px; object-fit: contain; flex: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
  #pName { font-weight: 800; font-size: 1.05rem; line-height: 1.15; }
  #pSees { font-size: .8rem; opacity: .8; margin-top: 4px; }
  #pFill { display: block; height: 100%; width: 0%; background: #ffd45e; border-radius: 99px; transition: width .12s; }
  #pFill.ok { background: #7cffb2; }
  #pTips { font-size: .85rem; line-height: 1.4; min-height: 3.6em; opacity: .95; }
  #pStatus { font-weight: 800; color: #7cffb2; }
  #pDone { font: inherit; font-weight: 600; font-size: .78rem; color: #fff; background: rgba(255,255,255,.16); border: 0; border-radius: 99px; padding: 5px 14px; cursor: pointer; }
  @media (max-width: 560px) { #practice { top: 64px; right: 12px; width: calc(100vw - 150px); padding: 10px 12px; } #pImg { width: 56px; height: 56px; } }
  #flashFx { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 15; }
  #flashFx.go { animation: flashgo .35s ease-out; }
  @keyframes flashgo { 0% { opacity: .85; } 100% { opacity: 0; } }
  @media (max-width: 560px) { .lbl { display: none; } .hb, #playBtn, #dexBtn { padding: 8px 11px; } .brand { padding: 8px 12px; font-size: .9rem; } }

  @media (max-width: 560px) {
    #game { top: 64px; right: 12px; width: calc(100vw - 150px); padding: 10px 12px; }
    #gImg { width: 56px; height: 56px; }
    .hdrR { gap: 6px; }
    #playBtn, #dexBtn { padding: 8px 12px; font-size: .85rem; }
    #cam { width: 120px; top: 64px; left: 12px; border-radius: 16px; }
    #name { padding: 8px 18px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } #startBtn:hover { transform: none; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<header>
  <div class="pill brand">Emoji Mirror 3D</div>
  <div class="hdrR"><button class="pill hb" id="snapBtn" type="button" aria-label="Take a photo">📸<span class="lbl"> Snap</span></button><button class="pill hb" id="tuneBtn" type="button" aria-label="Tune to your face">🎯<span class="lbl"> Tune</span></button><button class="pill" id="playBtn" type="button">▶ Play</button><button class="pill" id="dexBtn" type="button">Collection 0 / 0</button></div>
</header>

<div id="cam" hidden>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="handCv"></canvas>
  <span class="pill" id="handBadge">✋ starting</span>
  <button class="pill" id="stopBtn" type="button">Stop</button>
</div>

<div id="toast" class="pill" role="status"></div>

<div id="game" class="glass" hidden>
  <div class="gtop"><span id="gRound"></span><span id="gScore">0</span></div>
  <div class="gmain"><img id="gImg" alt=""><div><div id="gName"></div><div id="gHint"></div></div></div>
  <div class="gbar"><i id="gFill"></i></div>
  <div class="gfoot"><span id="gStreak"></span><span><button id="gMute" type="button">Sound on</button> <button id="gSkip" type="button">Skip</button> <button id="gQuit" type="button">Quit</button></span></div>
</div>
<div id="count" hidden aria-hidden="true"></div>
<div id="tune" class="glass" hidden>
  <div id="tStep"></div><img id="tImg" alt=""><div id="tTitle"></div><div id="tSub"></div>
  <div class="gbar"><i id="tFill"></i></div><button id="tCancel" type="button">Cancel</button>
</div>
<div id="flashFx"></div>
<div id="practice" class="glass" hidden>
  <div class="gtop"><span>Practice</span><span id="pPct">0%</span></div>
  <div class="gmain"><img id="pImg" alt=""><div><div id="pName"></div><div id="pSees"></div></div></div>
  <div class="gbar"><i id="pFill"></i></div>
  <div id="pTips"></div>
  <div class="gfoot"><span id="pStatus"></span><span><button id="pDone" type="button">Done</button></span></div>
</div>
<aside id="tileMenu" hidden aria-label="Emoji options"><div class="tmBox">
  <img id="tmImg" alt=""><div id="tmName"></div><div id="tmHint"></div>
  <div class="tmBtns"><button id="tmShow" type="button">Show in 3D</button><button id="tmPractice" type="button">Practice this one</button><button id="tmTeach" type="button">Teach it my face</button><button class="ghost" id="tmForget" type="button">Forget my version</button><button class="ghost" id="tmClose" type="button">Close</button></div>
</div></aside>
<aside id="shareModal" hidden aria-label="Share"><div class="smBox">
  <img id="shImg" alt="Your card"><div class="smBtns"><button id="shShare" type="button">Share</button><button id="shSave" type="button">Save image</button><button class="ghost" id="shClose" type="button">Close</button></div><p id="shNote"></p>
</div></aside>
<aside id="results" hidden aria-label="Game results"><div class="rbox" id="rbox"></div></aside>

<div id="caption">
  <div id="name" class="pill">Make a face, get the emoji</div>
  <div id="sub" class="pill">Your camera stays on this device. Nothing is uploaded.</div>
  <button id="startBtn" type="button">Start camera</button>
</div>

<aside id="dex" hidden aria-label="Emoji collection">
  <div class="dexTop">
    <h2 id="dexTitle">Collection</h2>
    <div>
      <button class="ghost" id="dexShare" type="button">Share collection</button>
      <button class="ghost" id="calReset" type="button">Reset tuning</button>
      <button class="ghost" id="dexReset" type="button">Reset progress</button>
      <button id="dexClose" type="button">Close</button>
    </div>
  </div>
  <div id="dexBody"></div>
</aside>

<pre id="debug" hidden></pre>

<script type="module">
/* ============================================================
   PURE LOGIC: emoji roster, expression scoring, hand gestures
   ============================================================ */
/* ==PURE START== */
const BASE = "https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/";
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

// Each rule: feature -> [min, max]. Features are 0..1 (see feats()).
// kind: "face" = detected from expression, "hand" = detected from hand near face,
//       "move" = detected from motion, "tap" = can't be detected, tap in the collection to preview
const GROUPS = [
  { id: "smile", title: "Smiles", note: "Happy faces, from a gentle smile to a full-on laugh." },
  { id: "tongue", title: "Tongues, kisses and puffs", note: "Mouth tricks." },
  { id: "shock", title: "Surprise and fear", note: "Open wide and raise your brows." },
  { id: "sad", title: "Sad and worried", note: "Frowns, tears and tired faces." },
  { id: "grump", title: "Angry, sly and sleepy", note: "Glares, smirks and snoozes." },
  { id: "move", title: "Moves and hands", note: "Shake your head, chatter your teeth, or bring a hand up to your face." },
  { id: "sign", title: "Hand signs", note: "Show a hand to the camera. These work even when your face is out of view." },
  { id: "tap", title: "Tap to preview", note: "These need props or context a camera can't see (masks, hats, thermometers). Tap one to see it in 3D." },
];

const R = (group, ch, folder, hint, rule, extra = {}) => ({
  group, ch, folder, hint, r: rule, kind: "face", id: slug(folder),
  path: extra.path || `${folder}/3D/${folder.toLowerCase().replace(/ /g, "_")}_3d.png`, ...extra,
});

const SIGN = (ch, folder, hint) => R("sign", ch, folder, hint, null,
  { kind: "sign", path: `${folder}/Default/3D/${folder.toLowerCase().replace(/ /g, "_")}_3d_default.png` });

const ROSTER = [
  // ---- Smiles
  R("smile","😀","Grinning face","Big open smile",{smile:[.45,1],jaw:[.1,.4],squint:[0,.45]}),
  R("smile","😃","Grinning face with big eyes","Smile wide and open your eyes wide",{smile:[.45,1],jaw:[.25,.7],wide:[.2,1],squint:[0,.35]}),
  R("smile","😄","Grinning face with smiling eyes","Laugh with squinty eyes",{smile:[.5,1],jaw:[.2,.6],squint:[.4,1]}),
  R("smile","😁","Beaming face with smiling eyes","Smile with teeth, mouth mostly shut",{smile:[.55,1],jaw:[0,.2],squint:[.35,1]}),
  R("smile","😆","Grinning squinting face","Laugh hard with eyes squeezed",{smile:[.6,1],jaw:[.3,.8],squint:[.65,1]}),
  R("smile","😅","Grinning face with sweat","A nervous smile with brows up",{smile:[.35,.85],browUp:[.45,1],stretch:[.2,1]}),
  R("smile","😂","Face with tears of joy","Crack up: huge laugh, eyes shut",{smile:[.7,1],jaw:[.4,1],squint:[.6,1],blink:[.3,1]}),
  R("smile","🤣","Rolling on the floor laughing","Huge laugh while tilting your head",{smile:[.6,1],jaw:[.35,1],tilt:[.25,1]}),
  R("smile","🙂","Slightly smiling face","A gentle smile",{smile:[.15,.42],jaw:[0,.12],squint:[0,.35],blink:[0,.35],smileDiff:[0,.3],tilt:[0,.4]}),

const BY_ID = Object.fromEntries(ROSTER.map(e => [e.id, e]));
const DETECT = ROSTER.filter(e => e.kind === "face");
const urlOf = e => BASE + e.path.split("/").map(encodeURIComponent).join("/");

const clamp01 = v => Math.max(0, Math.min(1, v));
const SOFT = 0.13;
function mem(v, [lo, hi]) {
  if (v < lo) return Math.max(0, 1 - (lo - v) / SOFT);
  if (v > hi) return Math.max(0, 1 - (v - hi) / SOFT);
  return 1;
}
function scoreRule(e, f) {
  let sum = 0, min = 1, n = 0;
  for (const k in e.r) {
    const m = mem(f[k] ?? 0, e.r[k]);
    sum += m; if (m < min) min = m; n++;
  }
  if (min < 0.15) return 0;
  return (0.5 * sum / n + 0.5 * min) * (1 + 0.04 * n);
}

// Turn raw blendshape scores (+ head pose, timers) into 0..1 features
function feats(b, pose, extra) {
  const g = k => b[k] || 0, avg = (a, c) => (g(a) + g(c)) / 2;
  const f = {};
  f.smile = avg("mouthSmileLeft", "mouthSmileRight");
  f.smileDiff = Math.abs(g("mouthSmileLeft") - g("mouthSmileRight"));
  f.frown = avg("mouthFrownLeft", "mouthFrownRight");
  f.jaw = g("jawOpen");
  const bl = g("eyeBlinkLeft"), br = g("eyeBlinkRight");
  f.blink = (bl + br) / 2; f.wink = Math.abs(bl - br);
  f.wide = avg("eyeWideLeft", "eyeWideRight");
  f.squint = avg("eyeSquintLeft", "eyeSquintRight");
  f.browUp = g("browInnerUp");
  const bol = g("browOuterUpLeft"), bor = g("browOuterUpRight");
  f.browOuter = Math.max(bol, bor); f.browOuterDiff = Math.abs(bol - bor);
  f.browDown = avg("browDownLeft", "browDownRight");
  f.pucker = g("mouthPucker"); f.funnel = g("mouthFunnel");
  f.tongue = g("tongueOut"); f.puff = g("cheekPuff");
  f.sneer = avg("noseSneerLeft", "noseSneerRight");
  f.press = avg("mouthPressLeft", "mouthPressRight");
  f.stretch = avg("mouthStretchLeft", "mouthStretchRight");
  f.upperUp = avg("mouthUpperUpLeft", "mouthUpperUpRight");
  f.rollLow = g("mouthRollLower"); f.rollUp = g("mouthRollUpper");
  f.lookUp = avg("eyeLookUpLeft", "eyeLookUpRight");
  f.lookDown = avg("eyeLookDownLeft", "eyeLookDownRight");
  f.lookIn = avg("eyeLookInLeft", "eyeLookInRight");
  f.shift = Math.max(g("mouthLeft"), g("mouthRight"));
  f.idle = clamp01(1 - Math.max(f.smile * 1.6, f.frown * 1.6, f.jaw * 2.2, f.browUp * 1.2, f.browDown * 1.2,
    f.pucker, f.tongue, f.press, f.stretch * 1.5, f.wink * 1.2, f.squint * 0.8, f.sneer));
  f.tilt = clamp01(Math.abs(pose?.roll || 0) / (70 * Math.PI / 180));
  f.drowsy = clamp01((extra?.closedMs || 0) / 3000);
  return f;
}

function classify(f, curId, extra = {}) {
  if (extra.handId) return { id: extra.handId, score: 2, top: [], all: {} };
  if (extra.shake) return { id: "shaking-face", score: 2, top: [], all: {} };
  if (extra.chatter) return { id: "cold-face", score: 1.8, top: [], all: {} };
  let best = null, bs = 0; const list = [], all = {};
  for (const e of DETECT) {
    const raw = scoreRule(e, f); all[e.id] = raw;
    const s = e.id === curId ? raw * 1.1 : raw;      // hysteresis: stick with the current emoji
    list.push([e.id, s]);
    if (s > bs) { bs = s; best = e.id; }
  }
  // faces the person taught the app
  for (const c of (extra.custom || [])) {
    const cs = customScore(c.vecs, f);
    if (cs < 0.55) continue;
    const raw = 0.6 + 0.8 * cs; all[c.id] = Math.max(all[c.id] || 0, raw);
    const s = c.id === curId ? raw * 1.1 : raw;
    list.push([c.id + " (yours)", s]);
    if (s > bs) { bs = s; best = c.id; }
  }
  list.sort((a, b) => b[1] - a[1]);
  if (!best || bs < 0.5) best = "neutral-face";
  return { id: best, score: bs, top: list.slice(0, 3), all };
}

// Hand near face -> emoji id. Points are in pixels. ref = face reference points (pixels).
// Distances are in "face widths" (cheek to cheek). Roughly: eyes->mouth 0.5, mouth->chin 0.33, forehead->eyes 0.4.
function handGesture(hand, ref, f, dbg) {
  const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const ids = [0, 5, 9, 13, 17];
  const palm = { x: ids.reduce((s, i) => s + hand[i].x, 0) / 5, y: ids.reduce((s, i) => s + hand[i].y, 0) / 5 };
  const fw = ref.fw;
  const scale = d(hand[0], hand[9]) / fw;            // how big the hand looks next to the face
  const dMouthPalm = d(palm, ref.mouth) / fw, dMouthIdx = d(hand[8], ref.mouth) / fw;
  const dEyes = d(palm, ref.eyes) / fw, dFore = d(palm, ref.fore) / fw, dChinIdx = d(hand[8], ref.chin) / fw;
  const wr = hand[0];
  const midCurled = d(hand[12], wr) < d(hand[9], wr) * 1.4;
  const idxUp = d(hand[8], wr) > d(hand[5], wr) * 1.15;
  // how much of the hand (21 points) sits inside each zone of the face
  const R = fw * 0.4;
  const inZone = cs => hand.filter(p => cs.some(c => Math.hypot(p.x - c.x, p.y - c.y) < R)).length / hand.length;
  const fEyes = inZone(ref.eyeL && ref.eyeR ? [ref.eyeL, ref.eyeR] : [ref.eyes]), fMouth = inZone([ref.mouth]), fFore = inZone([ref.fore]);
  if (dbg) Object.assign(dbg, { scale, dMouthPalm, dMouthIdx, dEyes, dFore, dChinIdx, fEyes, fMouth, fFore, midCurled, idxUp });

  if (scale < 0.3 || scale > 1.8) return null;       // hand far in front of or behind the face: not touching it

  // finger raised to the lips (palm stays away from the mouth)
  if (dMouthIdx < 0.35 && idxUp && midCurled && dMouthPalm > 0.45) return "shushing-face";

  // a zone counts if the palm is close OR a good share of the hand is inside it; best overlap wins
  const regions = [["eyes", dEyes, 0.45, fEyes], ["mouth", dMouthPalm, 0.5, fMouth], ["fore", dFore, 0.55, fFore]];
  let best = null;
  for (const [name, dd, lim, frac] of regions) {
    if (dd >= lim && frac < 0.33) continue;
    const score = frac + Math.max(0, 1 - dd / lim) * 0.5;
    if (!best || score > best.score) best = { name, score };
  }
  if (best) {
    if (best.name === "eyes") return "see-no-evil-monkey";
    if (best.name === "mouth") return (f.wide || 0) > 0.4 ? "face-with-open-eyes-and-hand-over-mouth" : "face-with-hand-over-mouth";
    return ((f.browDown || 0) < 0.2 && (f.frown || 0) < 0.2 && (f.blink || 0) < 0.4) ? "saluting-face" : "person-facepalming";
  }
  // finger or fist resting on the chin
  if (dChinIdx < 0.5 && dMouthPalm > 0.4) return "thinking-face";
  return null;
}

// ---------- tuning, custom faces, hand signs, challenge links ----------
const mean = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0;

// Re-center and re-scale raw blendshapes using a person's own neutral face and their biggest expressions
function calibrate(sm, cal) {
  if (!cal) return sm;
  const out = {};
  for (const k in sm) out[k] = clamp01((sm[k] - (cal.base[k] || 0)) * (cal.gain[k] || 1));
  return out;
}
function buildCal(neutral, poses) {
  const keys = new Set(); neutral.forEach(s => Object.keys(s).forEach(k => keys.add(k)));
  poses.forEach(ss => ss.forEach(s => Object.keys(s).forEach(k => keys.add(k))));
  const base = {}, gain = {}, peak = {};
  for (const k of keys) base[k] = mean(neutral.map(s => s[k] || 0));
  for (const samples of poses) for (const k of keys) {
    const vals = samples.map(s => s[k] || 0).sort((a, b) => a - b);
    const p = vals[Math.min(vals.length - 1, Math.floor(vals.length * 0.9))] ?? 0;   // 90th percentile ignores spikes
    if (peak[k] === undefined || p > peak[k]) peak[k] = p;
  }
  for (const k of keys) {
    const range = (peak[k] ?? 0) - base[k];
    gain[k] = range >= 0.15 ? Math.max(0.8, Math.min(2, 0.7 / range)) : 1;   // only rescale what they actually exercised
  }
  return { v: 1, base, gain };
}

// "Teach it a face": compare the current features to a saved feature vector
const CUSTOM_KEYS = ["smile","smileDiff","frown","jaw","blink","wink","wide","squint","browUp","browDown","browOuterDiff","pucker","funnel",
  "tongue","puff","sneer","press","stretch","upperUp","rollLow","rollUp","lookUp","lookDown","lookIn","shift","tilt"];
const vecOf = f => CUSTOM_KEYS.map(k => f[k] || 0);
function customScore(vecs, f) {
  const list = Array.isArray(vecs[0]) ? vecs : [vecs];   // one or several taught examples
  const v = vecOf(f); let best = 0;
  for (const vec of list) {
    let s = 0;
    for (let i = 0; i < v.length; i++) { const d = v[i] - vec[i]; s += d * d; }
    best = Math.max(best, clamp01(1 - Math.max(0, Math.sqrt(s / v.length) - 0.06) / 0.16));
  }
  return best;
}

    setStreakText(!anyFace ? "Show your face to start the clock" : (g.streaks.some(s => s > 1) ? `🔥 ${Math.max(...g.streaks)} in a row` : ""));

    let winner = -1;

  const link = pageUrl() + encodeChallenge(ids, score), text = `I scored ${score} on the Emoji Challenge. Can you beat it?`;
  try { if (navigator.share) { await navigator.share({ title: "Emoji Mirror 3D challenge", text, url: link }); return; } }
  catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(link); toast(hosted() ? "Challenge link copied" : "Link copied. It works for friends once this page is hosted online"); }
  catch (e) { prompt("Copy this link", link); }
}

let challenge = null;
function updatePlayLabel() { $("playBtn").textContent = challenge ? "▶ Play challenge" : "▶ Play"; }
function parseChallenge() {
  const c = decodeChallenge(location.hash); if (!c) return;
  challenge = c; updatePlayLabel();
  nameEl.textContent = "A friend challenged you!"; subEl.textContent = `They scored ${c.beat}. Press Play to try the same ${c.ids.length} emojis.`;
  try { history.replaceState(null, "", pageUrl()); } catch (e) {}
}

// ---------- boot ----------
async function boot() {
  try {
    THREE = await import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js");
  } catch (e) {
    nameEl.textContent = "Couldn't load the 3D engine"; subEl.textContent = "Check your internet connection and reload the page.";
    startBtn.hidden = true; return;
  }
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  maxAniso = renderer.capabilities.getMaxAnisotropy();
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50); camera.position.set(0, 0, CAM_Z);
  loader = new THREE.TextureLoader(); loader.setCrossOrigin("anonymous");
  const dc = document.createElement("canvas"); dc.width = dc.height = 32;
  const dx = dc.getContext("2d"), dg = dx.createRadialGradient(16, 16, 0, 16, 16, 16);
  dg.addColorStop(0, "#fff"); dg.addColorStop(1, "rgba(255,255,255,0)"); dx.fillStyle = dg; dx.fillRect(0, 0, 32, 32);
  dotTex = new THREE.CanvasTexture(dc);

  slots.push(makeSlot()); primary = slots[0];
  addEventListener("resize", () => { resize(); layoutSlots(slots.filter(s => s.active).length ? slots.filter(s => s.active) : [slots[0]]); });
  resize(); layoutSlots([slots[0]]);
  setShown(slots[0], "slightly-smiling-face", { silent: true });
  requestAnimationFrame(tick);
}

$("startBtn").addEventListener("click", start);
$("playBtn").addEventListener("click", playClicked);
$("gSkip").addEventListener("click", () => { if (game && game.state === "round") roundMiss(performance.now(), true); });
$("gQuit").addEventListener("click", quitGame);
$("gMute").addEventListener("click", () => { muted = !muted; $("gMute").textContent = muted ? "Sound off" : "Sound on"; });
$("stopBtn").addEventListener("click", stop);
$("dexBtn").addEventListener("click", () => { dexEl.hidden = false; });
$("dexClose").addEventListener("click", () => { dexEl.hidden = true; });
$("dexReset").addEventListener("click", () => { unlocked = new Set(); save(); updateCount(); ROSTER.forEach(e => markTile(e.id)); });
addEventListener("keydown", e => {
  if (e.key === "Escape") { dexEl.hidden = true; $("tileMenu").hidden = true; $("shareModal").hidden = true; if (task) cancelTask(); stopPractice(); if (game) quitGame(); }
  if (e.key === "d" || e.key === "D") debugEl.hidden = !debugEl.hidden;
});
$("snapBtn").addEventListener("click", snap);
$("tuneBtn").addEventListener("click", startTune);
$("tCancel").addEventListener("click", () => cancelTask());
$("pDone").addEventListener("click", stopPractice);
$("dexShare").addEventListener("click", async () => { toast("Making your card…"); const b = await makeCollectionCard(); if (b) openShare(b, "emoji-collection.png", `I've unlocked ${liveCount()} of ${liveTotal} emojis!`); });
$("calReset").addEventListener("click", () => { cal = null; try { localStorage.removeItem(CAL_STORE); } catch (e) {} updateTuneBtn(); toast("Tuning reset"); });
buildDex(); updateCount(); updateTuneBtn(); parseChallenge(); boot();
</script>
</body>
